<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>东营继续教育助手</title>
<style>
:root {
  --bg: #eef6ff;
  --panel: rgba(255, 255, 255, 0.92);
  --line: #d9e7f7;
  --text: #17233f;
  --muted: #6d7c95;
  --blue: #2f7df4;
  --orange: #f59e0b;
  --green: #18b46b;
  --shadow: 0 18px 45px rgba(23, 54, 97, 0.12);
}

* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
  color: var(--text);
  background:
    linear-gradient(135deg, rgba(222, 238, 255, 0.95), rgba(248, 252, 255, 0.98) 46%, rgba(232, 244, 255, 0.95)),
    radial-gradient(circle at 20% 10%, rgba(47, 125, 244, 0.16), transparent 34%);
}

.app {
  height: 100vh;
  display: grid;
  grid-template-rows: 66px 1fr 42px;
  padding: 0 22px 12px;
  gap: 14px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 78px;
  padding-top: 10px;
  -webkit-app-region: drag;
}

.brand, .top-actions, .chrome-controls {
  display: flex;
  align-items: center;
}

.brand { gap: 12px; }
.brand-icon {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: transparent;
  overflow: visible;
}
.brand-icon img {
  width: 34px;
  height: 34px;
  object-fit: contain;
  mix-blend-mode: multiply;
}
.brand h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 800;
}
.version {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 999px;
  background: #dfeafa;
  color: #31415c;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
}

.top-actions {
  gap: 18px;
  color: #27344d;
  font-weight: 700;
  -webkit-app-region: no-drag;
}
.setting {
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
}
.chrome-controls {
  gap: 8px;
}
.window-btn {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  position: relative;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: #1b2741;
  font-size: 0;
  cursor: pointer;
}
.window-btn:hover {
  background: rgba(29, 111, 232, 0.08);
}
.window-btn::before,
.window-btn::after {
  content: "";
  display: block;
  position: absolute;
  background: currentColor;
}
#win-min::before {
  width: 10px;
  height: 1.5px;
  border-radius: 999px;
}
#win-max::before {
  width: 9px;
  height: 9px;
  border: 1.5px solid currentColor;
  background: transparent;
  border-radius: 1px;
}
#win-close::before,
#win-close::after {
  width: 11px;
  height: 1.5px;
  border-radius: 999px;
}
#win-close::before {
  transform: rotate(45deg);
}
#win-close::after {
  transform: rotate(-45deg);
}
#win-close:hover {
  background: #ef4444;
  color: #fff;
}

.main {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(620px, 1fr) 398px;
  gap: 18px;
}

.browser-card,
.panel-card {
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  border-radius: 12px;
  overflow: hidden;
}

.browser-card {
  display: grid;
  grid-template-rows: 58px 1fr;
  min-width: 0;
}

.browser-toolbar {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 14px;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.78);
  border-bottom: 1px solid var(--line);
}
.nav-icons, .tool-icons {
  display: flex;
  align-items: center;
  gap: 16px;
  color: #24314a;
}
.tool-btn {
  border: 0;
  background: transparent;
  color: inherit;
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
}
.tool-btn.muted { color: #9aa8bb; }
.address {
  height: 36px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 13px;
  border: 1px solid #d4e0ef;
  border-radius: 9px;
  background: #fff;
}
#yx-address {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: #526079;
  font: inherit;
  font-size: 15px;
}
.browser-placeholder {
  display: grid;
  place-items: center;
  color: #8a99af;
  background: #fff;
}

.side {
  min-height: 0;
  display: grid;
  grid-template-rows: minmax(200px, auto) 1fr;
  gap: 14px;
}
.panel-card { padding: 18px; }
.panel-card.fill {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-card.fill .status-list { flex-shrink: 0; }
.panel-card.fill .log-area { flex: 1; }
.section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  color: #22314f;
  font-size: 15px;
  font-weight: 800;
}
.section-title.control-title::before {
  content: "";
  width: 18px;
  height: 18px;
  border-radius: 5px;
  background:
    linear-gradient(#6c739f 0 0) left 2px top 2px / 6px 6px no-repeat,
    linear-gradient(#6c739f 0 0) right 2px top 2px / 6px 6px no-repeat,
    linear-gradient(#6c739f 0 0) left 2px bottom 2px / 6px 6px no-repeat,
    linear-gradient(#6c739f 0 0) right 2px bottom 2px / 6px 6px no-repeat;
  opacity: .95;
}
.action-stack { display: grid; gap: 14px; }
.action-btn {
  width: 100%;
  min-height: 78px;
  border: 1px solid transparent;
  border-radius: 14px;
  display: grid;
  grid-template-columns: 52px 1fr;
  align-items: center;
  gap: 16px;
  padding: 0 18px;
  text-align: left;
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .42);
}
.start {
  color: #eff8f7;
  background: linear-gradient(135deg, #8fb2b9, #739ca5);
  box-shadow: 0 14px 26px rgba(104, 138, 147, .20);
}
.stop {
  color: #9d5a51;
  background: linear-gradient(135deg, #fff6f3, #fee8e2);
  border-color: #f5d7cf;
  box-shadow: 0 10px 22px rgba(216, 172, 162, .16);
}
.exam-only {
  color: #a46d2f;
  background: linear-gradient(135deg, #fffaf1, #fff0d7);
  border-color: #f1ddba;
  box-shadow: 0 10px 22px rgba(226, 194, 141, .14);
}
.round-icon {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  position: relative;
  background: rgba(255, 255, 255, .82);
  box-shadow: 0 8px 18px rgba(255, 255, 255, .18);
  font-size: 0;
}
.round-icon::before,
.round-icon::after {
  content: "";
  position: absolute;
}
.start .round-icon::before {
  left: 18px;
  top: 13px;
  width: 0;
  height: 0;
  border-top: 10px solid transparent;
  border-bottom: 10px solid transparent;
  border-left: 14px solid #7b96a0;
}
.stop .round-icon::before {
  width: 16px;
  height: 16px;
  border-radius: 4px;
  background: #c88a81;
  inset: 15px;
}
.exam-only .round-icon::before {
  left: 14px;
  top: 13px;
  width: 18px;
  height: 20px;
  border-radius: 4px;
  background: #d3a56a;
}
.exam-only .round-icon::after {
  left: 19px;
  top: 9px;
  width: 8px;
  height: 6px;
  border: 3px solid #d3a56a;
  border-bottom: 0;
  border-radius: 8px 8px 0 0;
}
.btn-title {
  display: block;
  font-size: 17px;
  line-height: 1.2;
  font-weight: 800;
}
.btn-sub {
  display: block;
  margin-top: 6px;
  font-size: 12px;
  opacity: .88;
}
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.stat-card {
  min-height: 74px;
  display: grid;
  grid-template-columns: 48px 1fr;
  align-items: center;
  gap: 11px;
  padding: 12px;
  border: 1px solid #dce8f5;
  border-radius: 9px;
  background: linear-gradient(135deg, #f8fbff, #ffffff);
}
.stat-card.exam {
  border-color: #f8dfb6;
  background: linear-gradient(135deg, #fffaf1, #fff);
}
.stat-card.time {
  grid-column: 1 / -1;
  border-color: #ccefdc;
  background: linear-gradient(135deg, #f1fff7, #ffffff);
}
.stat-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: #eaf2ff;
  color: var(--blue);
  font-weight: 800;
}
.exam .stat-icon { background: #fff1d9; color: var(--orange); }
.time .stat-icon { background: #dcf9e9; color: var(--green); }
.stat-label {
  color: #25314a;
  font-size: 13px;
  font-weight: 800;
}
.stat-value {
  margin-top: 4px;
  font-size: 25px;
  line-height: 1;
  font-weight: 900;
  color: var(--blue);
}
.exam .stat-value { color: var(--orange); }
.time .stat-value { color: var(--green); }
.unit {
  margin-left: 5px;
  color: #7c8ba2;
  font-size: 12px;
  font-weight: 700;
}
.status-list {
  display: grid;
  gap: 9px;
  color: #3b4963;
  font-size: 13px;
}
.status-row {
  display: grid;
  grid-template-columns: 12px 76px 1fr;
  align-items: center;
  gap: 6px;
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
}
.row-label { color: #65758f; }
.row-value {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-weight: 700;
}
.log-area {
  min-height: 116px;
  overflow: auto;
  margin-top: 14px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #e1eaf5;
  background: #f7fbff;
  font-family: Consolas, "Microsoft YaHei", monospace;
  font-size: 12px;
  line-height: 1.6;
  color: #53627b;
}
.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #237447;
  font-size: 13px;
  font-weight: 700;
}
.footer-actions {
  display: flex;
  align-items: center;
  gap: 32px;
  color: #1d6fe8;
}
.footer-version {
  color: #70819d;
}
.footer-link {
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
  padding: 4px 0;
}
.footer-link:hover {
  color: #0f5fe1;
  text-decoration: underline;
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon"><img src="../logo.gif" alt="Logo" /></div>
      <h1>东营继续教育助手</h1>
    </div>
    <div class="top-actions">
      <div class="chrome-controls">
        <button class="window-btn" id="win-min">—</button>
        <button class="window-btn" id="win-max">□</button>
        <button class="window-btn" id="win-close">×</button>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="browser-card">
      <div class="browser-toolbar">
        <div class="nav-icons">
          <button class="tool-btn" id="nav-back">‹</button>
          <button class="tool-btn muted" id="nav-forward">›</button>
          <button class="tool-btn" id="nav-refresh">↻</button>
        </div>
        <div class="address">
          <span>🔒</span>
          <input id="yx-address" value="http://sddy.gxk.yxlearning.com/login" spellcheck="false" autocomplete="off" />
        </div>
        <div class="tool-icons">☆</div>
      </div>
      <div class="browser-placeholder">左侧浏览器正在加载...</div>
    </section>

    <aside class="side">
      <section class="panel-card">
        <div class="section-title">▦ 控制中心</div>
        <div class="action-stack">
          <button class="action-btn start" id="yx-btn-start" type="button">
            <span class="round-icon">▶</span>
            <span><span class="btn-title">开始视频课程学习</span><span class="btn-sub">自动学习课程，智能完成任务</span></span>
          </button>
          <button class="action-btn stop" id="yx-btn-stop" type="button" disabled>
            <span class="round-icon">■</span>
            <span><span class="btn-title">停止学习</span><span class="btn-sub">停止所有学习任务</span></span>
          </button>
          <button class="action-btn exam-only" id="yx-btn-exam" type="button">
            <span class="round-icon">📝</span>
            <span><span class="btn-title">开始考试</span><span class="btn-sub">先完成视频课程再考试</span></span>
          </button>
        </div>
      </section>

      <section class="panel-card fill">
        <div class="section-title">⌁ 运行状态</div>
        <div class="status-list">
          <div class="status-row"><span class="dot"></span><span class="row-label">程序状态:</span><span class="row-value" id="yx-phase">就绪</span></div>
          <div class="status-row"><span class="dot"></span><span class="row-label">当前任务:</span><span class="row-value" id="yx-status">等待开始</span></div>
          <div class="status-row"><span class="dot"></span><span class="row-label">运行时长:</span><span class="row-value" id="yx-runtime">00:00:00</span></div>
          <div class="status-row"><span class="dot"></span><span class="row-label">完成课程:</span><span class="row-value" id="yx-course-done">--</span></div>
          <div class="status-row"><span class="dot"></span><span class="row-label">完成考试:</span><span class="row-value" id="yx-done">--</span></div>
        </div>
        <div class="log-area" id="yx-log"></div>
      </section>
    </aside>
  </main>

  <footer class="footer">
    <div>● 浏览器内核运行正常</div>
    <div class="footer-actions">
      <span class="version footer-version">v1.0.0</span>
      <button class="footer-link" id="yx-check-update" type="button">↻ 检查更新</button>
    </div>
  </footer>
</div>

<script>
var startedAt = null;
var running = false;
var timerInterval = null;
var logBuffer = [];
var maxLogLines = 200;

var controlTitle = document.querySelector('.panel-card .section-title');
if (controlTitle) controlTitle.textContent = '手动登录后开始自动学习';

function setText(id, value) {
  var el = document.getElementById(id);
  if (el) el.textContent = String(value);
}

function formatRuntime(ms) {
  var total = Math.max(0, Math.floor(ms / 1000));
  var h = String(Math.floor(total / 3600)).padStart(2, '0');
  var m = String(Math.floor((total % 3600) / 60)).padStart(2, '0');
  var s = String(total % 60).padStart(2, '0');
  return h + ':' + m + ':' + s;
}

function addLog(text, time) {
  var log = document.getElementById('yx-log');
  var row = document.createElement('div');
  row.textContent = (time || new Date().toLocaleTimeString()) + ' ' + text;
  log.appendChild(row);
  // Trim old entries
  while (log.children.length > maxLogLines) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}

function formatHours(ms) {
  var hours = ms / 3600000;
  return hours.toFixed(1);
}

// ── Toolbar buttons ────────────────────────────────────────
document.getElementById('yx-address').addEventListener('keydown', function(event) {
  if (event.key !== 'Enter') return;
  window.yxNative.navigate(event.target.value).then(function(url) {
    event.target.value = url;
  });
});
document.getElementById('nav-back').onclick = function() { window.yxNative.back(); };
document.getElementById('nav-forward').onclick = function() { window.yxNative.forward(); };
document.getElementById('nav-refresh').onclick = function() { window.yxNative.refresh(); };
document.getElementById('win-min').onclick = function() { window.yxNative.minimize(); };
document.getElementById('win-max').onclick = function() { window.yxNative.maximize(); };
document.getElementById('win-close').onclick = function() { window.yxNative.close(); };
document.getElementById('yx-check-update').onclick = function() {
  window.yxNative.checkUpdate().then(function() {
    addLog('已打开更新页面，请下载最新版本后替换旧程序');
  });
};

// ── Start / Stop ───────────────────────────────────────────
document.getElementById('yx-btn-start').onclick = function() {
  window.yxNative.start();
  addLog('收到开始学习指令');
};
document.getElementById('yx-btn-stop').onclick = function() {
  window.yxNative.stop();
  addLog('发送停止请求...');
};
document.getElementById('yx-btn-exam').onclick = function() {
  window.yxNative.startExam();
  addLog('进入考试模式');
};

// ── URL updates from BrowserView ───────────────────────────
window.yxNative.onUrl(function(url) {
  document.getElementById('yx-address').value = url;
});

// ── Status updates from automation ─────────────────────────
window.yxNative.onStatus(function(data) {
  running = !!data.running;
  if (running) {
    if (!startedAt) startedAt = Date.now();
    startTimer();
  } else {
    stopTimer();
    startedAt = null;
  }
  document.getElementById('yx-btn-start').disabled = running;
  document.getElementById('yx-btn-stop').disabled = !running;
  document.getElementById('yx-btn-exam').disabled = running;
  setText('yx-phase', data.phase || '就绪');
  setText('yx-status', data.task || '等待开始');
  if (!running) setText('yx-runtime', '00:00:00');
});

// ── Log entries from automation ────────────────────────────
window.yxNative.onLog(function(data) {
  addLog(data.text, data.time);
});

// ── Course count updates ───────────────────────────────────
window.yxNative.onCourses(function(data) {
  if (data.current) {
    // Currently playing a course: show "completed/total | current"
    setText('yx-courses', (data.completed || 0) + '/' + (data.total || '--'));
  } else if (data.total) {
    setText('yx-courses', (data.completed || 0) + '/' + data.total);
  }
});

// ── Exam count updates ─────────────────────────────────────
window.yxNative.onExams(function(data) {
  setText('yx-exams', data.pending != null ? String(data.pending) : '--');
  setText('yx-done', data.completed != null ? String(data.completed) + ' 项' : '--');
  if (data.total != null) {
    setText('yx-course-done', '共 ' + data.total + ' 个考试');
  }
});

// ── Runtime tick from main process ─────────────────────────
window.yxNative.onRuntimeTick(function(data) {
  if (data.elapsed != null) {
    setText('yx-runtime', formatRuntime(data.elapsed));
    setText('yx-hours', formatHours(data.elapsed));
  }
});

// ── Local timer fallback ───────────────────────────────────
function startTimer() {
  if (timerInterval) return;
  timerInterval = setInterval(function() {
    if (startedAt) {
      var elapsed = Date.now() - startedAt;
      setText('yx-runtime', formatRuntime(elapsed));
      setText('yx-hours', formatHours(elapsed));
    }
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}
</script>
</body>
</html>
